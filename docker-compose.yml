services:
  todo:
    build: .
    environment:
      PORT: ${PORT:-1337}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Manila}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: task_db
      DB_USER: ${DB_USER:-todo}
      DB_PASS: ${DB_PASS:-todo_password}
    ports:
      # Host and container ports must match the PORT the app listens on.
      - "${PORT:-1337}:${PORT:-1337}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: task_db
      MYSQL_USER: ${DB_USER:-todo}
      MYSQL_PASSWORD: ${DB_PASS:-todo_password}
      TZ: ${APP_TIMEZONE:-Asia/Manila}
    ports:
      # Optional: lets HeidiSQL on the host connect to 127.0.0.1:3307.
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      # Data survives restarts and `docker compose down`.
      - db_data:/var/lib/mysql
      # Runs once, on first start with an empty volume: creates the tables.
      - ./task_db.sql:/docker-entrypoint-initdb.d/01-task_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  db_data:
